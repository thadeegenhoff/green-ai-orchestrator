experiment:
  name: quickstart_fedavg_cifar10_iid_20r_ep2_b64
  strategy: fedavg
  dataset: cifar10
  split: iid
  model: quickstart-pytorch
  description: Quickstart PyTorch auf CIFAR-10 mit flexiblem Image, FedAvg, IID-Split,
    20 Server-Runden, 2 lokalen Epochen und Batch Size 64.
cluster_profile: cluster_profiles/k3s_greenai.yaml
project:
  app_dir: quickstart-pytorch
  app_name: quickstart-pytorch
  superlink_connection: null
  stream: true
  run_config:
    strategy: fedavg
    dataset: cifar10
    split: iid
    num-server-rounds: 20
    fraction-train: 1.0
    fraction-evaluate: 0.5
    min-train-nodes: 2
    min-evaluate-nodes: 2
    min-available-nodes: 2
    local-epochs: 2
    learning-rate: 0.1
    batch-size: 64
  metadata:
    framework: pytorch
    task_type: image-classification
    dataset_source: uoft-cs/cifar10
    model_family: simple-cnn
    image: thadegreen/quickstart-pytorch-flex:0.1
    resource_policy: equal_clients
energy:
  enabled: true
  node_mapping: node_mapping.json
  script: scripts/energy_summary.py
  run_on_invalid: false
metrics_export:
  enabled: true
  script: scripts/write_fl_metrics_to_influx.py
  run_on_invalid: false
report:
  enabled: true
  formats:
  - markdown
  - html
kubernetes_runtime:
  app_image: thadegreen/quickstart-pytorch-greenai:0.2
  client_groups:
  - name: cloud-gpu
    tier: high
    zone: cloud
    replicas: 1
    node_selector:
      kubernetes.io/hostname: cloud-gpu
  - name: old-laptop
    tier: medium
    zone: edge
    replicas: 1
    node_selector:
      kubernetes.io/hostname: old-laptop
  - name: rpi5-16gb
    tier: medium
    zone: edge
    replicas: 1
    node_selector:
      kubernetes.io/hostname: pi5-16gb
  - name: rpi5-8gb
    tier: low
    zone: edge
    replicas: 1
    node_selector:
      kubernetes.io/hostname: pi5-8gb
