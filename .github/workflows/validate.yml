name: Validate orchestrator
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q run_experiment.py scripts quickstart-pytorch/pytorchexample
      - run: bash -n scripts/run_inference_eval_k3s.sh
      - run: python run_experiment.py --help
