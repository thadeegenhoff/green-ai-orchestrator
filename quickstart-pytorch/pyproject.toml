[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.1.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.28.0",
    "flwr-datasets[vision]>=0.6.0",
    "torch",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.29.0"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 0.5
local-epochs = 1
learning-rate = 0.1
batch-size = 32
strategy = "fedavg"
dataset = "cifar10"
split = "iid"
fraction-train = 1.0
min-train-nodes = 2
min-evaluate-nodes = 2
min-available-nodes = 2
num-partitions = 4
partition-plan = ""
server-learning-rate = 0.1
client-learning-rate = 0.1
beta-1 = 0.9
beta-2 = 0.99
tau = 0.001
timeout = 3600.0
dirichlet-alpha = 0.5
min-partition-size = 10
self-balancing = true
partition-seed = 42
classes-per-partition = 2
class-assignment-mode = "first-deterministic"
run-dir = "."
